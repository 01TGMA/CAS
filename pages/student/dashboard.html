<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard — AttendPro</title>
<link rel="stylesheet" href="../../css/style.css">
<link rel="stylesheet" href="../../css/dashboard.css">
</head>
<body>
<div id="app-shell-root"></div>

<template id="tpl-dashboard">
  <div class="page-heading">
    <h1>Dashboard</h1>
    <p>Your attendance and exam eligibility across all enrolled courses.</p>
  </div>

  <div class="stat-grid">
    <div class="card">
      <div class="card-header"><div class="stat-card-title"><span id="icon-trend"></span> Overall Attendance</div></div>
      <div class="card-content stat-card-body" id="circular-progress-slot"></div>
    </div>

    <div class="card">
      <div class="card-header"><div class="stat-card-title"><span id="icon-award"></span> Total Marks</div></div>
      <div class="card-content" style="display:flex;flex-direction:column;justify-content:center;">
        <div class="marks-row"><span class="big" id="total-marks"></span><span class="of" id="total-max-marks"></span></div>
        <p class="text-muted" style="margin:0.25rem 0 0;font-size:0.875rem;" id="marks-caption"></p>
      </div>
    </div>

    <div class="card">
      <div class="card-header"><div class="stat-card-title"><span id="icon-book"></span> Eligibility Status</div></div>
      <div class="card-content" style="display:flex;flex-direction:column;gap:0.75rem;justify-content:center;">
        <span id="eligibility-badge-slot"></span>
        <p id="eligibility-caption" style="margin:0;font-size:0.875rem;"></p>
      </div>
    </div>
  </div>

  <div class="card card-flush">
    <div class="card-header"><h3 class="card-title">Enrolled Courses</h3></div>
    <div class="card-content">
      <div class="list-header">
        <span>Course</span><span>Attendance</span><span style="text-align:right;">Status</span>
      </div>
      <ul class="course-list" id="course-list"></ul>
    </div>
  </div>
</template>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="../../js/lib/client.js"></script>
<script src="../../js/lib/icons.js"></script>
<script src="../../js/lib/store.js"></script>
<script src="../../js/lib/shell.js"></script>
<script>window.BASE_PATH = '../../';</script>
<script src="../../js/student/dashboard.js"></script>
</body>
</html>
